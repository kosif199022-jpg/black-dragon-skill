name: Golden Dragon Distillation Tests
on:
  pull_request:
    paths:
      - 'apps/golden-dragon/forge/distill_skills.py'
      - 'apps/golden-dragon/forge/query_distilled.py'
      - 'apps/golden-dragon/tests/test_distill_skills.py'
      - 'apps/golden-dragon/tests/test_query_distilled.py'
      - '.github/workflows/golden-dragon-distillation.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated distillation tests
        run: |
          python -m unittest discover -s apps/golden-dragon/tests -p 'test_distill_skills.py' -v
          python -m unittest discover -s apps/golden-dragon/tests -p 'test_query_distilled.py' -v
      - name: Compile source files
        run: python -m py_compile apps/golden-dragon/forge/distill_skills.py apps/golden-dragon/forge/query_distilled.py
